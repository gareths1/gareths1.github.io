<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Waddle</title>
<style>
  :root { --bg:#f4f8fb; --fg:#12263a; --card:#fff; --muted:#5b6f82; --accent:#1f6feb; --line:#d8e3ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1621; --fg:#e6eef6; --card:#16212e; --muted:#93a6b8; --accent:#58a6ff; --line:#263648; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--fg); line-height:1.5; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; } .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .card img { width:100%; max-height:420px; object-fit:cover; display:block; background:var(--line); }
  .body { padding: 18px 20px 22px; }
  .label { color:var(--accent); font-weight:600; font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; }
  .card h2 { margin: 4px 0 0; } .sci { color:var(--muted); font-style:italic; margin:0 0 10px; }
  .fact { font-size:1.1rem; margin:12px 0; } .meta { color:var(--muted); font-size:.92rem; margin:4px 0; }
  .badge { display:inline-block; padding:2px 10px; border-radius:999px; border:1px solid var(--line); font-size:.82rem; }
  button { font:inherit; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; margin: 8px 8px 0 0; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  h3 { margin: 32px 0 12px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; padding:0; margin:0; text-align:left; color:var(--fg); }
  .tile img { width:100%; height:100px; object-fit:cover; display:block; }
  .tile span { display:block; padding:8px 10px; font-size:.9rem; }
  footer { margin-top:32px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>🐧 The Daily Waddle</h1>
  <p class="sub">A new penguin every day, same one for everyone (UTC date).</p>

  <article class="card" id="card" aria-live="polite">
    <img id="img" alt="">
    <div class="body">
      <div class="label" id="label">Loading…</div>
      <h2 id="name"></h2>
      <p class="sci" id="sci"></p>
      <span class="badge" id="status"></span>
      <p class="fact" id="fact"></p>
      <p class="meta" id="habitat"></p>
      <p class="meta" id="diet"></p>
      <p class="meta" id="size"></p>
      <button id="today">Penguin of the Day</button>
      <button id="random" class="ghost">Random fact</button>
    </div>
  </article>

  <h3>All species</h3>
  <div class="grid" id="grid"></div>
  <footer>Data from my <a href="https://github.com/gareths1/daily-waddle">Daily Waddle API</a> project.</footer>
</main>

<script>
const DATA_URL = "penguins.json";   // produced by export_static.py
const $ = (id) => document.getElementById(id);
let penguins = [];

// Same rule as the API: Python's date.toordinal() == days since Unix epoch + 719163.
function pickDaily() {
  const sorted = [...penguins].sort((a, b) => (a.id < b.id ? -1 : 1));
  const ordinal = Math.floor(Date.now() / 86400000) + 719163;   // UTC day
  const p = sorted[ordinal % sorted.length];
  const f = p.facts.length ? p.facts[Math.floor(ordinal / sorted.length) % p.facts.length] : null;
  return { p, f };
}

function show(p, f, label) {
  $("label").textContent = label;
  $("img").src = p.image_url;
  $("img").alt = p.common_name;
  $("name").textContent = p.common_name;
  $("sci").textContent = p.scientific_name;
  $("status").textContent = p.conservation_status;
  $("fact").textContent = f ? f.text : "";
  $("habitat").textContent = "Habitat: " + p.habitat;
  $("diet").textContent = "Diet: " + p.diet;
  $("size").textContent = `Size: about ${p.height_cm} cm, ${p.weight_kg} kg`;
}

function showDaily() { const { p, f } = pickDaily(); show(p, f, "Penguin of the Day"); }

function showRandom() {
  const pool = penguins.flatMap((p) => p.facts.map((f) => ({ p, f })));
  const { p, f } = pool[Math.floor(Math.random() * pool.length)];
  show(p, f, "Random penguin");
}

function buildGrid() {
  const grid = $("grid");
  [...penguins].sort((a, b) => a.common_name.localeCompare(b.common_name)).forEach((p) => {
    const tile = document.createElement("button");
    tile.className = "tile";
    const img = document.createElement("img");
    img.src = p.image_url; img.alt = ""; img.loading = "lazy";
    const name = document.createElement("span");
    name.textContent = p.common_name;
    tile.append(img, name);
    tile.addEventListener("click", () => {
      show(p, p.facts[0] || null, "Species");
      $("card").scrollIntoView({ behavior: "smooth" });
    });
    grid.append(tile);
  });
}

fetch(DATA_URL)
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    penguins = data;
    showDaily(); buildGrid();
    $("today").addEventListener("click", showDaily);
    $("random").addEventListener("click", showRandom);
  })
  .catch(() => { $("label").textContent = "Couldn't load penguins.json"; });
</script>
</body>
</html>
